worker_processes auto;
# The container rootfs is read-only and the process runs unprivileged, so every
# writable path points into the tmpfs.
pid /tmp/nginx.pid;
# Keep every runtime path inside the tmpfs.
error_log /dev/stderr warn;
# nginx resolves its compiled-in log paths against this prefix; the rootfs is read-only.

events {
    worker_connections 1024;
}

http {
    # nginx resolves its compiled-in log paths against this prefix, and /var/lib
    # is not writable for the unprivileged user.
    error_log /dev/stderr warn;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # No access log: the reverse proxy in front already logs, duplicates are noise.
    access_log off;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 12m;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    # Hand-written CSS/JS only: these are stable and compress extremely well.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json text/xml image/svg+xml;

    upstream php-fpm {
        server unix:/tmp/fpm.sock;
        keepalive 16;
    }

    server {
        # Binds every interface by design: the service is reachable directly on the
        # tailnet as well as through the /report reverse proxy.
        listen 0.0.0.0:3560;
        server_name _;

        root /app/public;
        index index.php;
        charset utf-8;

        # The proxy strips /report before forwarding, so locations are absolute.
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # `tailscale serve --set-path /report` strips the prefix, so proxied requests
        # arrive bare. Direct access on the tailnet keeps it (/report/board), so the
        # prefix is removed here too — both paths then hit the same routes.
        location ~ ^/report(/.*)?$ {
            rewrite ^/report(/.*)$ $1 last;
            rewrite ^/report$ / last;
        }

        # Assets carry a content hash in the query string, so they can be cached
        # aggressively; nginx ignores the query when matching the file itself.
        location ~* ^/assets/.+\.(css|js|woff2|svg|png|ico)$ {
            expires 30d;
            add_header Cache-Control "public";
            access_log off;
            try_files $uri =404;
        }

        # Real-time document editing (docs/documents.md): the Yjs service runs as its
        # own container on the loopback. The upgrade headers are the whole point —
        # without them this is a request that never upgrades and the editor silently
        # stays in polling mode. Authorization is a signed token in the query string,
        # checked by that service, so nothing here has to know about sessions.
        location /collab/ {
            proxy_pass http://127.0.0.1:1234/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location = /healthz {
            access_log off;
            fastcgi_pass php-fpm;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /app/public/index.php;
            fastcgi_param REQUEST_URI /healthz;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        location ~ \.php$ {
            fastcgi_pass php-fpm;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param SCRIPT_NAME $fastcgi_script_name;
            # Never let a proxy environment variable leak into PHP-FPM requests.
            fastcgi_param HTTP_PROXY "";
            fastcgi_read_timeout 30;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
            fastcgi_keep_conn on;
        }

        # Never serve dotfiles or the framework's own directories.
        location ~ /\.(?!well-known) {
            deny all;
        }
    }
}
