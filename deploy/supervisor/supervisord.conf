; Two tiny foreground processes, one container: php-fpm and nginx. Supervisor is
; only here so either one dying takes the container down loudly instead of leaving
; a half-broken service (the Quadlet unit restarts it).
[supervisord]
nodaemon=true
; Running as the unprivileged nobody user: supervisor must not try to setuid.
user=nobody
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
loglevel=info

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize --fpm-config /usr/local/etc/php-fpm.conf
priority=10
startsecs=1
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;" -e /dev/stderr
priority=20
startsecs=1
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
