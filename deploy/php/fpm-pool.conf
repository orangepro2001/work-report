; Static worker set: the container is pinned to a few cores on the AI host, and
; php-fpm's dynamic management adds latency spikes for a handful of concurrent
; users. Sized against 2 vCPU (docs/perf.md).
[www]
user = nobody
group = nobody
; A Unix socket avoids the loopback port clash when two containers share host networking.
listen = /tmp/fpm.sock
listen.owner = nobody
listen.group = nobody
listen.mode = 0666
pm = static
pm.max_children = 8
pm.max_requests = 800
request_terminate_timeout = 35s
access.log = /dev/null
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /dev/stderr
