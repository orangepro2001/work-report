; work-report PHP runtime tuning.
;
; Optimised for a single-container, low-traffic-but-latency-sensitive deployment:
; every request is a handful of queries, so the fast path matters more than
; throughput per worker.

memory_limit = 512M
max_execution_time = 30
max_input_time = 30
post_max_size = 12M
upload_max_filesize = 10M

; Never leak the runtime version or expose PHP errors to clients.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Time is Seoul; the workbook's 보고일 and the 지연 rule both assume it.
date.timezone = Asia/Seoul

opcache.enable = 1
opcache.enable_cli = 0
; The image is immutable and the code never changes at runtime, so validation is
; pure overhead. Deployments restart the container, which resets the cache.
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 24
opcache.max_accelerated_files = 20000
; JIT: the exporter walks a lot of small PHP calls; tracing helps there without
; hurting the plain request path much.
opcache.jit = tracing
opcache.jit_buffer_size = 64M

; Sessions live in the database, so the garbage collector must not be too eager.
session.gc_maxlifetime = 43200
session.cookie_httponly = 1
session.cookie_samesite = Lax

realpath_cache_size = 4096K
realpath_cache_ttl = 600
